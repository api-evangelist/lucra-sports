aid: lucra-sports
name: Lucra Sports
description: 'Lucra (Lucra Sports, Inc.) is a competitive-loyalty and gamification platform that
  embeds real-money, free-to-play and peer-to-peer contests into third-party consumer apps and
  websites through a white-label SDK. Partners integrate Games You Play (head-to-head recreational
  matchups), Sports You Watch (prediction contests), Tournaments, Mini Games and Achievements
  without building the regulated infrastructure themselves: Lucra acts as merchant of record and
  operates the KYC, geolocation, age verification, payments, fraud monitoring, prize settlement and
  responsible-gaming controls behind the experience. The developer surface is a tenant-scoped
  server-to-server REST API (the Forge gateway) plus iOS, Android, React Native and JavaScript
  client SDKs, a signed webhook event stream, and a sandbox environment.'
