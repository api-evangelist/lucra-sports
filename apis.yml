apis:
- aid: lucra-sports-forge-api
  name: Lucra Forge API
  description: 'Forge is Lucra''s unified server-to-server API gateway. It exposes tenant-scoped
    tournament management (create, update, cancel, complete, leaderboard, rewards, tags),
    recreational game (Games You Play) lifecycle and score ingestion, generic user score ingestion,
    webhook subscription management, tenant tag groups, and location/state availability lookups.
    Authentication is a tenant API key in the X-Lucra-Api-Key header. The gateway also carries the
    preserved legacy /api/rest/pool-tournament surface alongside the v2 resources.'
  humanURL: https://docs.lucrasports.com/lucra-sdk/sdks-and-apis/api-reference
  baseURL: https://forge.lucrasports.com
