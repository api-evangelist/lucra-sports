gaps:
- >-
  The subscription list published on the Webhook Subscriptions page (14 names) does not include
  FtpMatchupCreated, TournamentCompletionFailed or TournamentComplianceLimitExceeded, all three of
  which are named as subscribable elsewhere in Lucra's own material. The catalog and the reference
  are out of sync, and the two missing tournament events are precisely the failure paths of the
  asynchronous completion flow.
