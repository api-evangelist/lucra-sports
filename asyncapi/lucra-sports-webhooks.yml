asyncapi_spec_published: false
asyncapi_note: >-
  Lucra publishes no AsyncAPI document. The event surface is real and well documented in prose and in
  the Forge OpenAPI (subscriptions are managed through REST), so this artifact captures the webhook
  catalog rather than fabricating a spec.
transport: https-webhook
delivery:
  direction: outbound
  method: POST
  content_type: application/json
  target: partner-supplied HTTPS URL per subscription
  custom_headers: 'Optional partner-supplied headers, set as a JSON string on the subscription record.'
  retries: undocumented
  ordering: undocumented
  duplicate_delivery: >-
    Possible — Lucra instructs integrators to "handle duplicate webhook deliveries gracefully". No
    delivery-id header is documented for de-duplication, so partners must de-duplicate on the event
    payload itself.
security:
  signature_header: X-Lucra-Signature
  algorithm: HMAC-SHA256
  encoding: hex digest, sha256= prefixed
  signed_over: raw request body
  secret_distribution: >-
    Per-webhook-configuration shared secret, issued out of band by a Lucra representative (for example
    via a single-use secret link) after the webhook is registered. Not retrievable through the API.
  rotation: >-
    No rotation endpoint. To rotate, create a new configuration record and delete the compromised one,
    then obtain the new secret from a Lucra representative.
  guidance:
  - Verify against the raw body — do not parse and re-stringify the JSON.
  - Use a constant-time comparison to prevent timing attacks.
  - Accept webhooks over HTTPS only.
  source: https://docs.lucrasports.com/lucra-sdk/server-to-server/webhook-subscriptions/request-verification.md
management:
  api: Forge REST
  operations:
  - operation_id: WebhooksController_createWebhook
    method: POST
    path: /api/rest/webhook/configs
  - operation_id: WebhooksController_listWebhooks
    method: GET
    path: /api/rest/webhook/configs
  - operation_id: WebhooksController_updateWebhook
    method: PUT
    path: /api/rest/webhook/configs/{id}
  - operation_id: WebhooksController_deleteWebhook
    method: DELETE
    path: /api/rest/webhook/configs/{id}
  constraints:
  - Maximum of 5 webhook configuration records per tenant.
  - A configuration may carry all subscriptions or a chosen subset.
  - >-
    Single-instance subscriptions (for example C2CWithdrawal) can exist in only one configuration
    record at a time.
  - Subscriptions accept an optional expirationDate and an active flag.
