domain_standard:
  applicable: false
  market: real-money skill-based contests / competitive loyalty embedded in third-party apps
  finding: >-
    This market has no interoperability standard to conform to. There is no equivalent of FHIR, SCIM,
    OpenRTB or ISO 20022 for embedded skill-based wagering: the constraints in this sector are
    jurisdictional licensing and regulatory ones (state-by-state skill-gaming law, KYC/AML obligation,
    geolocation integrity), not message-format ones. Nothing in the Forge contract declares a domain
    schema, URN, or message type belonging to an external standards body, and none is invented here.
  probed_regimes:
  - regime: payments
    result: >-
      Lucra moves real money (card and ACH deposits, ACH withdrawals) but publishes no PCI DSS, EMV,
      3-D Secure or ISO 20022 claim, and card capture is delegated to payment partners. No payments
      standard is asserted on Lucra's behalf.
compliance_program:
  published: true
  certifications_named: []
  certifications_note: >-
    No third-party certification is published anywhere on Lucra's public surface — no SOC 2, ISO
    27001, PCI DSS attestation, HIPAA or FedRAMP claim, and no trust center. What Lucra publishes
    instead is an operational compliance PROGRAM, described in detail and specific enough to audit
    against, which is why this is recorded as a program rather than a certification.
  controls:
  - name: KYC / identity verification
    detail: >-
      Name, address, phone and date of birth collected in the SDK, with ID-scan fallback and a manual
      processing queue. Prevents duplicate accounts; cross-tenant accounts are linked behind the
      scenes. UserKYCVerified is emitted as a webhook event.
  - name: AML / transaction monitoring
    detail: >-
      All deposits and withdrawals are monitored and potentially fraudulent transactions are failed.
      Sardine is named as the real-time withdrawal transaction-monitoring vendor.
  - name: Transaction limits
    detail: >-
      $500 per deposit, $3,500 per week, $14,000 per month; $500 per withdrawal; $500 per contest —
      published explicitly as a fraud and money-laundering risk control.
  - name: Geolocation integrity
    detail: >-
      GeoComplySDK is bundled as a binary dependency of the iOS SDK. Testing from outside the U.S.
      requires the tester's location to be whitelisted by Lucra, confirming enforcement is live.
  - name: Device / fraud intelligence
    detail: MobileIntelligence is bundled alongside GeoComply in the iOS SDK binary distribution.
  - name: Age verification
    detail: Users must be at least 18 to interact with the Lucra SDK.
  - name: Jurisdictional scope control
    detail: >-
      Availability is enumerated per product per U.S. state, and the Forge API exposes GET
      /api/v1/states so an integrator can read the eligible jurisdiction list programmatically rather
      than hard-coding it.
    operation_id: StatesController_findAll_v1
  - name: Responsible gaming
    detail: A published responsible-gaming policy at https://www.playlucra.com/legal/responsible-gaming.
  - name: Tax reporting
    detail: SSN collected before withdrawal for tax reporting; documented as not stored after collection.
  - name: Merchant of record
    detail: >-
      Lucra is the merchant of record for the real-money flows, which moves the licensing and
      settlement obligation off the integrating partner. This is the core of the commercial offer.
