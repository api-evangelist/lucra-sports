authentication_if_built:
  scheme: X-Lucra-Api-Key header
  scoping: tenant
  note: A server would carry one tenant key, so every tool call is inherently scoped to a single partner
    tenant. That is a good fit for MCP, but it also means the server cannot be multi-tenant without a
    key per session.
agent_safety_notes:
- Six of these candidate tools move real money or settle real contests (cancel/complete on tournaments
  and recreational games). Cancel refunds all participants; complete distributes payouts and the spec
  states it is irreversible. Any real server MUST gate these behind confirmation rather than expose them
  as ordinary tools.
- The completion tools return 202 Accepted and finish asynchronously — a tool call returning success means
  accepted, not done. The outcome only arrives on the webhook stream (TournamentCompleted / TournamentCompletionFailed
  / TournamentComplianceLimitExceeded).
- Forge publishes no idempotency key, so a retried tool call after a timeout has no documented safe behaviour.
