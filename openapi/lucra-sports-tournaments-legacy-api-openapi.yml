          type: string
          description: CASH_FIXED or CASH_PERCENTAGE
          enum:
          - CASH_FIXED
          - CASH_PERCENTAGE
          - TENANT_REWARD
          - NO_REWARD
          example: CASH_FIXED
        gameId:
          type: string
          description: External game identifier
          example: GOLF
        locationIds:
          description: Array of location UUIDs
          example: []
