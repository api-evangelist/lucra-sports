summary: >-
  Lucra ships four first-party client SDKs — Android, iOS, React Native and JavaScript/web — and all
  four are actively released: every one shipped a version in August 2026, within days of this probe.
  Distribution is uneven, though: only the Android artifacts are on a public registry. iOS is a
  binary xcframework hosted on Lucra's own S3, React Native is on GitHub Packages behind a personal
  access token, and the web SDK is installed straight from the GitHub repository with no registry at
  all. There is no first-party server-side SDK for the Forge REST API in any language.
