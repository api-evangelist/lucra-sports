server_side_sdks:
  count: 0
  note: >-
    The Forge REST API has no first-party server SDK in any language. Integrators call it with plain
    HTTP and an X-Lucra-Api-Key header. The Scalar reference at https://forge.lucrasports.com/docs/
    generates per-language snippets, and the OpenAPI in this repo can generate a client.
