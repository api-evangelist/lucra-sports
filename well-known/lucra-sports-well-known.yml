finding: >-
  Lucra serves no /.well-known/ discovery surface at all. Every path on every host returned 404 (or,
  on the GitBook docs host, an identical catch-all 307). No pointer of type WellKnown, SecurityTxt or
  APICatalog is emitted from this probe, because a recorded absence must not be scored as a presence.
notable_absences:
- >-
  No security.txt. For a platform that holds identity documents, SSNs, bank connections and real
  money, the lack of an RFC 9116 contact is the single cheapest gap on this profile to close.
- >-
  No api-catalog. Lucra runs two API generations across four hosts (forge / forge.sandbox /
  api / api.sandbox) plus a Hasura GraphQL endpoint, and nothing at a well-known path tells a machine
  that any of them exist.
